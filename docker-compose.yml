# ══════════════════════════════════════════════════════════
# EmbedAI — Docker Compose (EC2 Production)
#
# External services (NOT in this file):
#   • Qdrant → Qdrant Cloud (free tier)
#   • Postgres → Supabase (free tier)
#   • Frontend → Vercel (free tier)
# ══════════════════════════════════════════════════════════

services:
  redis:
    image: redis:7-alpine
    container_name: embedai-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: embedai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      # Mount widget so you can update it without rebuilding
      - ./backend/widget:/app/widget:ro

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: embedai-worker
    restart: unless-stopped
    command: celery -A celery_app:celery_app worker --loglevel=info --concurrency=1
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

volumes:
  redis_data:
