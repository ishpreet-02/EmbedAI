# ══════════════════════════════════════════════════════════
# EmbedAI — Docker Compose (EC2 Production)
#
# External services (NOT in this file):
#   • Qdrant → Qdrant Cloud (free tier)
#   • Postgres → Supabase (free tier)
#   • Frontend → Vercel (free tier)
# ══════════════════════════════════════════════════════════

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: embedai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      # Mount widget so you can update it without rebuilding
      - ./backend/widget:/app/widget:ro
