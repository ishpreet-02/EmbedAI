# /etc/nginx/sites-available/chatbot-api
#
# Replace YOUR_DOMAIN with your actual domain (e.g. api.chatsaas.com)
# After setting up, run: sudo certbot --nginx -d YOUR_DOMAIN

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Max upload size (for future file uploads if needed)
    client_max_body_size 10M;

    # ── API + Widget — proxy to FastAPI ───────────────────
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for streaming responses (SSE / chunked transfer)
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;

        # Timeout for long-running scraping jobs
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
    }

    # ── CORS headers for widget (cross-origin script) ─────
    # FastAPI already handles CORS, but this ensures preflight
    # OPTIONS requests work even if they hit Nginx directly
    location /api/chat/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
            add_header Access-Control-Expose-Headers "X-Visitor-Id, X-Conversation-Id";
            add_header Content-Length 0;
            return 204;
        }

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
    }

    # ── Widget JS — cache-friendly ────────────────────────
    location = /widget.js {
        proxy_pass http://127.0.0.1:8000/widget.js;
        proxy_set_header Host $host;

        # Cache widget for 1 hour — visitors don't re-download every page load
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin *;
    }
}
